name: Monthly data update

on:
  schedule:
    - cron: "17 6 5 * *"   # 06:17 UTC on the 5th of every month
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download open data (Indeed Hiring Lab, CC BY 4.0)
        run: |
          mkdir -p raw
          git clone --depth 1 https://github.com/hiring-lab/ai-tracker raw/ai-tracker
          git clone --depth 1 https://github.com/hiring-lab/job_postings_tracker raw/job_postings_tracker

      - name: Rebuild the dataset
        run: python scripts/build_dataset.py raw data

      - name: Save changes
        run: |
          git config user.name "cognitive-roi-data-robot"
          git config user.email "cognitive-roi-data-robot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Monthly data update $(date -u +%Y-%m)"
          git push
